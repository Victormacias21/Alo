<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>San Valentín</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff5f7;
  font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;
}

.card{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  text-align:center;
}

.gif{
  width:100%;
  max-height:320px;
  object-fit:cover;
  border-radius:14px;
}

.question{
  margin:16px 0;
  font-size:20px;
  font-weight:600;
}

.final{
  font-size:30px;
  font-weight:800;
  margin:20px 0;
}

.btns{
  display:flex;
  gap:16px;
  margin-top:18px;
}

button{
  flex:1;
  border:0;
  padding:14px 16px;
  border-radius:14px;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  transition:all .3s ease;
}

.yes{
  background:#ff2d55;
  color:#fff;
}

.no{
  background:#111827;
  color:#fff;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="card">
  <img id="pic" class="gif">

  <div id="question" class="question">
    ¿Te gustaría ser mi cita de San Valentín?
  </div>

  <div id="buttons" class="btns">
    <button id="yesBtn" class="yes">Sí ❤️</button>
    <button id="noBtn" class="no">No 😢</button>
  </div>
</div>

<script>

// GIF URLs
const START_GIF = "https://media2.giphy.com/media/r4UG27LD5Ee5y/giphy.gif";
const NO_GIF_1 = "https://media3.giphy.com/media/TyySuRrLVNJIY/giphy.gif";
const NO_GIF_2 = "https://media0.giphy.com/media/1JmGiBtqTuehfYxuy9/giphy.gif";
const NO_GIF_3 = "https://media1.giphy.com/media/ck27cNlAHxveU/giphy.gif";
const FINAL_GIF = "https://media4.giphy.com/media/ByPIQpyaB74pa/giphy.gif";

// Elements
const pic = document.getElementById("pic");
const question = document.getElementById("question");
const buttons = document.getElementById("buttons");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

let step = 0;
let yesScale = 1;

// Load first gif
pic.src = START_GIF;

// Debug safety if gif fails
pic.onerror = () => {
  question.textContent = "No se pudo cargar el GIF 😅";
};

// YES CLICK
yesBtn.addEventListener("click", () => {
  question.textContent = "Ouuuuu yeeeeahhh, te amo!";
  question.classList.add("final");
  buttons.classList.add("hidden");
  pic.src = FINAL_GIF;
});

// NO CLICK
noBtn.addEventListener("click", () => {

  step++;
  yesScale += 0.35;

  // Grow YES button
  yesBtn.style.transform = `scale(${yesScale})`;

  // Shrink NO button safely
  const noScale = Math.max(0.2, 1 - step * 0.25);
  noBtn.style.transform = `scale(${noScale})`;

  if(step === 1){
    question.textContent = "¿Estás segura?";
    pic.src = NO_GIF_1;
  }
  else if(step === 2){
    question.textContent = "¿Segurísima?";
    pic.src = NO_GIF_2;
  }
  else{
    question.textContent = "Ya no hay escapatoria 😈";
    pic.src = NO_GIF_3;
    noBtn.classList.add("hidden");
  }

});

</script>

</body>
</html>
